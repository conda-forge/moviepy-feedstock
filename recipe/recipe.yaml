schema_version: 1

context:
  name: moviepy
  version: 2.2.1
  sha256: c80cb56815ece94e5e3e2d361aa40070eeb30a09d23a24c4e684d03e16deacb1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - decorator >=4.0.2,<6.0
    - imageio >=2.5,<3.0
    - imageio-ffmpeg >=0.2.0
    - tqdm >=4.11.2,<5.0
    - numpy
    - requests >=2.8.1,<3.0
    - proglog <=1.0.0
    - ffmpeg
    - pillow <11.0,>=9.2.0
    - python-dotenv

tests:
  - python:
      imports:
        - moviepy
        - moviepy.audio
        - moviepy.audio.fx
        - moviepy.audio.io
        - moviepy.audio.tools
        - moviepy.video
        - moviepy.video.compositing
        - moviepy.video.fx
        - moviepy.video.io
        - moviepy.video.tools
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENCE.txt
  summary: Video editing with Python
  homepage: https://zulko.github.io/moviepy
  repository: https://github.com/Zulko/moviepy
  documentation: https://zulko.github.io/moviepy

extra:
  recipe-maintainers:
    - jakirkham
    - jan-janssen
